<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Music Streaming App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1db954;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 30px;
        }

        .song-card {
            background-color: #282828;
            width: 200px;
            margin: 15px;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .song-card img {
            width: 100%;
            border-radius: 8px;
        }

        .song-card h3 {
            font-size: 18px;
            margin: 10px 0 5px 0;
        }

        .song-card p {
            font-size: 14px;
            color: #ccc;
            margin: 0;
        }

        .logout-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #e22134;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-button:hover {
            background-color: #ff4c5c;
        }
    </style>
</head>
<body>
    <header>Welcome, {{ user_name }}!</header>
    <button class="logout-button" onclick="window.location.href='/logout'">Logout</button>
    
    <div class="container">
        <!-- Example songs -->
        <div class="song-card">
            <img src="/static/images/song1.jpg" alt="Song 1">
            <h3>Song Title 1</h3>
            <p>Artist 1</p>
        </div>
        <div class="song-card">
            <img src="/static/images/song2.jpg" alt="Song 2">
            <h3>Song Title 2</h3>
            <p>Artist 2</p>
        </div>
        <div class="song-card">
            <img src="/static/images/song3.jpg" alt="Song 3">
            <h3>Song Title 3</h3>
            <p>Artist 3</p>
        </div>
        <!-- Add more songs dynamically -->
    </div>
</body>
</html>
